services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: aisafetyops-kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s

  jobmanager:
    image: flink:1.20.2-scala_2.12-java17
    container_name: aisafetyops-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - "FLINK_PROPERTIES=jobmanager.rpc.address: jobmanager"
    depends_on:
      kafka:
        condition: service_healthy

  taskmanager:
    image: flink:1.20.2-scala_2.12-java17
    container_name: aisafetyops-taskmanager
    command: taskmanager
    environment:
      - "FLINK_PROPERTIES=jobmanager.rpc.address: jobmanager"
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=2
    depends_on:
      - jobmanager
