global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "flink-jobmanager"
    static_configs:
      - targets: ["jobmanager:9249"]

  - job_name: "flink-taskmanager"
    static_configs:
      - targets: ["taskmanager:9250"]

  - job_name: "aisafetyops-pushgateway"
    static_configs:
      - targets: ["pushgateway:9091"]
